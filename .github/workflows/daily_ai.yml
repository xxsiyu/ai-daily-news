name: Daily AI News

# GitHub 内置 schedule 对此仓库未生效，请用 cron-job.org 每天触发（见仓库说明）。
on:
  workflow_dispatch:
  repository_dispatch:
    types: [daily-news]

permissions:
  contents: read

concurrency:
  group: daily-ai-news
  cancel-in-progress: false

jobs:
  send-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python daily_ai_news.py
